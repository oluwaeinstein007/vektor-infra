# apps/ (web dashboard, field PWA, API gateway plugins) — §9.6. Small enough
# list that individual Applications read more clearly than an ApplicationSet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vektor-platform-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vektor/vektor-platform.git
    targetRevision: main
    path: apps/web/deploy/helm
  destination:
    server: https://kubernetes.default.svc
    namespace: vektor-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vektor-platform-field-pwa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vektor/vektor-platform.git
    targetRevision: main
    path: apps/field-pwa/deploy/helm
  destination:
    server: https://kubernetes.default.svc
    namespace: vektor-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
