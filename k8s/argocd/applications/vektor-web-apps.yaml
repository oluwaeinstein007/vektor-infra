# apps/ (web dashboard, field PWA) — §9.6, vektor-web repo. Small enough
# list that individual Applications read more clearly than an ApplicationSet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vektor-web-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/oluwaeinstein007/vektor-web.git
    targetRevision: master
    path: apps/web/deploy/helm
  destination:
    server: https://kubernetes.default.svc
    namespace: vektor-web
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vektor-web-field-pwa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/oluwaeinstein007/vektor-web.git
    targetRevision: master
    path: apps/field-pwa/deploy/helm
  destination:
    server: https://kubernetes.default.svc
    namespace: vektor-web
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
